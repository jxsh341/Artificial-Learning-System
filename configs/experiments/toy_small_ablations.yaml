# Example experiment config: toy_small task + full ablation matrix (spec §20).
# Usage:
#   python scripts/run_experiment.py --config configs/experiments/toy_small_ablations.yaml
experiment_name: toy_small_ablations
seed: 0
seeds: [0, 1, 2]
results_dir: results

graph:
  family: random
  num_nodes: 50
  node_feature_dim: 16
  edge_feature_dim: 4
  directed: true
  weighted: false
  seed: 123
  params:
    p: 0.08

gnn:
  layers: 2
  hidden_dim: 32
  dropout: 0.0
  aggregation: mean
  residual: true
  use_edge_features: false

ssm:
  state_dim: 32
  diagonal: true
  max_radius: 0.99
  init_decay: 0.9
  nonlinearity: tanh

transformer:               # used by ablation M5
  d_model: 32
  nhead: 4
  layers: 2

readout:
  pooling: attention
  selected_nodes: null
  head_hidden: 0

task:
  num_cues: 4
  num_actions: 2
  cue_feature_dim: 8
  structure: hierarchical
  num_families: 2
  feature_noise: 0.25
  mapping: family
  delay: 1
  reward_correct: 1.0
  reward_incorrect: 0.0
  stochastic_prob: 0.0
  sensory_nodes: null
  train_cues: [0, 1]
  test_cues: [2, 3]

training:
  batch_size: 8
  sequence_length: 16
  episodes: 40
  learning_rate: 0.001
  weight_decay: 0.0
  grad_clip: 1.0
  record_aux_every: 0

evaluation:
  acquisition: true
  retention: true
  reversal: true
  generalization: true
  criterion: 0.85
  criterion_window: 20
  retention_delays: [0, 10, 50]
  retention_test_steps: 50
  retention_distractor: blank
  reversal_episodes: 80
  generalization_test_steps: 100
  eval_batch_size: 8

ablations:
  enabled: true
  models: [M1, M2, M3, M4, M5, M6]   # M4 re-run under ablations cross-checks the main run

checkpointing:
  save: true
