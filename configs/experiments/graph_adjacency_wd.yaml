# FIXED graph-dependent classification: both classes come from the SAME
# connected-graph family; only the marked pair differs (adjacent vs distance
# >= neg_min_distance). No graph-level statistic can reveal the label — only
# marker relations can. Sum aggregation (mean dilutes the marker signal).
# Usage: python scripts/run_experiment.py --config configs/experiments/graph_adjacency.yaml
experiment_name: graph_adjacency_wd
seed: 0
seeds: [0, 1]
results_dir: results

graph:
  node_feature_dim: 16
  edge_feature_dim: 0

gnn:
  layers: 2               # 2-hop receptive field; negatives at distance >= 3 stay outside
  hidden_dim: 64
  dropout: 0.0
  aggregation: sum
  residual: true
  use_edge_features: false

ssm:
  state_dim: 64
  diagonal: true
  max_radius: 0.99
  init_decay: 0.9
  nonlinearity: tanh

readout:
  pooling: attention
  selected_nodes: null
  head_hidden: 0

task:
  type: graph_classification
  label_mode: adjacency   # positives: marked pair adjacent; negatives: distance >= 3
  neg_min_distance: 3
  num_nodes: 100
  max_path_len: 3
  edge_density: 0.04
  marker_dim: 2
  directed: false
  dataset_seed: 123
  num_train: 400
  num_test: 100
  test_num_nodes: 200
  delay: 0
  reward_correct: 1.0
  reward_incorrect: 0.0
  stochastic_prob: 0.0

training:
  batch_size: 16
  sequence_length: 32
  episodes: 80
  learning_rate: 0.001
  weight_decay: 0.01
  grad_clip: 1.0
  record_aux_every: 0

evaluation:
  acquisition: true
  criterion: 0.85
  criterion_window: 25
  rewired_levels: [0.25, 0.5, 1.0]   # M7 controls (rewired + degree-preserving swapped)
  eval_batch_size: 16

ablations:
  enabled: false
  models: [M1, M2, M6]    # M1/M6: no message passing; M2: GNN without SSM

checkpointing:
  save: true

