# FIXED delayed relational task: the answer depends on the marked pair's
# adjacency (relational), computed at presentation, then must be preserved
# across a marker-free delay (temporal retention). Marker-free response
# graphs are uninformative, so the locus dissociation is meaningful here.
# Usage: python scripts/run_experiment.py --config configs/experiments/graph_adjacency_delayed.yaml
experiment_name: graph_adjacency_delayed
seed: 0
seeds: [0, 1]
results_dir: results

graph:
  node_feature_dim: 16
  edge_feature_dim: 0

gnn:
  layers: 2
  hidden_dim: 64
  dropout: 0.0
  aggregation: sum
  residual: true
  use_edge_features: false

ssm:
  state_dim: 64
  diagonal: true
  max_radius: 0.99
  init_decay: 0.9
  nonlinearity: tanh

readout:
  pooling: attention
  selected_nodes: null
  head_hidden: 0

task:
  type: graph_classification
  label_mode: adjacency
  neg_min_distance: 3
  num_nodes: 100
  max_path_len: 3
  edge_density: 0.04
  marker_dim: 2
  directed: false
  dataset_seed: 123
  num_train: 400
  num_test: 100
  test_num_nodes: 200
  delay: 3
  keep_markers_during_delay: false
  reward_correct: 1.0
  reward_incorrect: 0.0
  stochastic_prob: 0.0

training:
  batch_size: 16
  sequence_length: 32
  episodes: 100
  learning_rate: 0.001
  weight_decay: 0.0
  grad_clip: 1.0
  record_aux_every: 0

evaluation:
  acquisition: true
  criterion: 0.85
  criterion_window: 25
  rewired_levels: [0.25, 0.5, 1.0]
  eval_batch_size: 16

ablations:
  enabled: true
  models: [M1, M2, M6]

checkpointing:
  save: true
