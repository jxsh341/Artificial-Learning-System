# Phase 2-4: deep analysis on the toy task —
# memory-retention curve, temporal attacks, storage locus, graph attacks.
# Usage: python scripts/run_experiment.py --config configs/experiments/deep_analysis.yaml
experiment_name: deep_analysis
seed: 0
seeds: [0, 1]
results_dir: results

graph:
  family: small_world
  num_nodes: 50
  node_feature_dim: 16
  edge_feature_dim: 4
  directed: true
  weighted: false
  seed: 123
  params:
    k: 6
    p: 0.1

gnn:
  layers: 2
  hidden_dim: 32
  dropout: 0.0
  aggregation: mean
  residual: true
  use_edge_features: false

ssm:
  state_dim: 32
  diagonal: true
  max_radius: 0.99
  init_decay: 0.9
  nonlinearity: tanh

readout:
  pooling: attention
  selected_nodes: null
  head_hidden: 0

task:
  num_cues: 4
  num_actions: 2
  cue_feature_dim: 8
  structure: hierarchical
  num_families: 2
  feature_noise: 0.25
  mapping: family
  delay: 1
  reward_correct: 1.0
  reward_incorrect: 0.0
  stochastic_prob: 0.0
  sensory_nodes: null
  train_cues: [0, 1]
  test_cues: [2, 3]

training:
  batch_size: 8
  sequence_length: 16
  episodes: 60
  learning_rate: 0.001
  weight_decay: 0.0
  grad_clip: 1.0
  record_aux_every: 0

evaluation:
  acquisition: true
  retention: true
  reversal: true
  generalization: true
  criterion: 0.85
  criterion_window: 20
  retention_delays: [0, 10, 50]
  retention_test_steps: 50
  retention_distractor: blank
  reversal_episodes: 80
  generalization_test_steps: 100
  eval_batch_size: 8

  # --- phase 2: memory-retention curve (accuracy vs temporal distance) ---
  memory_curve: true
  memory_curve_delays: [0, 2, 10, 50, 100, 500, 1000, 5000]
  memory_curve_repeats: 20

  # --- phase 3: attack the system ---
  temporal_perturbations: true
  storage_locus: true
  perturbation_steps: 200
  noise_sigmas: [0.1, 0.5, 1.0]
  reset_fractions: [0.25, 0.5, 0.75]
  truncation_intervals: [2, 5, 10]

  # --- phase 4: attack the graph ---
  graph_perturbations: true
  graph_edge_levels: [0.25, 0.5, 0.75]
  graph_node_levels: [0.1, 0.25, 0.5]
  graph_weight_levels: [0.25, 0.5, 1.0]

ablations:
  enabled: false
  models: []

checkpointing:
  save: true
