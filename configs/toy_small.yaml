# Toy small configuration — fast sanity runs.
experiment_name: toy_small
seed: 0
seeds: [0, 1]
results_dir: results

graph:
  family: random
  num_nodes: 50
  node_feature_dim: 16
  edge_feature_dim: 4
  directed: true
  weighted: false
  seed: 123
  params:
    p: 0.08

gnn:
  layers: 2
  hidden_dim: 32
  dropout: 0.0
  aggregation: mean
  residual: true
  use_edge_features: false

ssm:
  state_dim: 32
  diagonal: true
  max_radius: 0.99
  init_decay: 0.9
  nonlinearity: tanh

readout:
  pooling: attention
  selected_nodes: null
  head_hidden: 0

task:
  num_cues: 4
  num_actions: 2
  cue_feature_dim: 8
  structure: hierarchical
  num_families: 2
  feature_noise: 0.25
  mapping: family
  delay: 1
  reward_correct: 1.0
  reward_incorrect: 0.0
  stochastic_prob: 0.0
  sensory_nodes: null
  train_cues: [0, 1]   # one exemplar per family -> both actions trained
  test_cues: [2, 3]    # held-out exemplars of the same families

training:
  batch_size: 8
  sequence_length: 16
  episodes: 40
  learning_rate: 0.001
  weight_decay: 0.0
  grad_clip: 1.0
  record_aux_every: 0

evaluation:
  acquisition: true
  retention: true
  reversal: true
  generalization: true
  criterion: 0.85
  criterion_window: 20
  retention_delays: [0, 10, 50]
  retention_test_steps: 50
  retention_distractor: blank
  reversal_episodes: 80
  generalization_test_steps: 100
  eval_batch_size: 8

ablations:
  enabled: false
  models: [M1, M2, M3, M4, M6]

checkpointing:
  save: true
