# Toy medium configuration — one scale step above base (spec §29 scaling path).
experiment_name: toy_medium
seed: 0
seeds: [0, 1, 2]
results_dir: results

graph:
  family: modular
  num_nodes: 500
  node_feature_dim: 16
  edge_feature_dim: 4
  directed: true
  weighted: false
  seed: 123
  params:
    communities: 8
    p_in: 0.1
    p_out: 0.01

gnn:
  layers: 3
  hidden_dim: 128
  dropout: 0.0
  aggregation: mean
  residual: true
  use_edge_features: false

ssm:
  state_dim: 128
  diagonal: true
  max_radius: 0.99
  init_decay: 0.9
  nonlinearity: tanh

readout:
  pooling: attention
  selected_nodes: null
  head_hidden: 0

task:
  num_cues: 6
  num_actions: 2
  cue_feature_dim: 8
  structure: hierarchical
  num_families: 2
  feature_noise: 0.25
  mapping: family
  delay: 2
  reward_correct: 1.0
  reward_incorrect: 0.0
  stochastic_prob: 0.0
  sensory_nodes: null
  train_cues: [0, 1, 3, 4]
  test_cues: [2, 5]

training:
  batch_size: 16
  sequence_length: 32
  episodes: 200
  learning_rate: 0.001
  weight_decay: 0.0
  grad_clip: 1.0
  record_aux_every: 100

evaluation:
  acquisition: true
  retention: true
  reversal: true
  generalization: true
  criterion: 0.85
  criterion_window: 25
  retention_delays: [0, 10, 50, 100, 500]
  retention_test_steps: 100
  retention_distractor: blank
  reversal_episodes: 120
  generalization_test_steps: 200
  eval_batch_size: 16

ablations:
  enabled: false
  models: [M1, M2, M3, M4, M6]

checkpointing:
  save: true
